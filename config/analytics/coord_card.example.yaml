# FAKE exercise coord card. NavTracker does not load this file unless
# ANALYTICS_COORD_CARD or analytics.coord_card points at it. The block
# numbers below are examples for a made-up exercise, not a live default.
#
# Field order follows the owner's MTI, IMINT, ELINT, and FUSED layouts.
# Add another type, or extra field names, for a different exercise.
# Unknown field names are kept as message attributes. "-" and blank
# fields are null. A null ellipse orientation is a circle of the
# semi-major length.
#
# ellipse_unit is nmi (nautical miles, the default), km, or meters.
# Lengths are stored in meters. magnetic_declination_degrees is added
# to a magnetic ellipse orientation. Positive means magnetic north is
# east of true north. Zero leaves magnetic and true north the same.
# CAT is a target-location-error category. A lower number is more
# accurate. cat_ce maps each category to a circular-error radius.
# bullseye is a config hook only. The reference point is unknown until
# an exercise publishes one, so bullseye text on a message is stored raw.
#
# rooms.ingest is the card-wide ingest default. Each type and template
# can set its own ingest and publish rooms. A confidence/CAT rule on
# rooms.publish wins for a matching notice. Fake room ids only.
# schema_version selects a JSON Schema. The bundled catalog's default
# is "1". A card without this field uses that default.
schema_version: "1"
mismatch_meters: 250
ellipse_unit: nmi
magnetic_declination_degrees: 0
cat_ce:
  unit: m
  radii:
    I: 6
    II: 15
    III: 30
    IV: 91
confidence_terms:
  - {phrase: POSS LOW, level: possible, band: low, weight: 0.25}
  - {phrase: POSS HIGH, level: possible, band: high, weight: 0.45}
  - {phrase: PROB, level: probable, weight: 0.70, aliases: [PROBABLE]}
  - {phrase: CONFIRMED, level: confirmed, weight: 1.0, aliases: [CERTAIN, VERIFIED]}
assessment_text:
  single: "SINGLE SOURCE {phrase}"
  correlated: "ASSESSED {phrase} (FROM {reported} {ids})"
  disagreement: "REPORTED {reported} ASSESSED {phrase} (FROM {ids})"
  republish: "WAS {previous} NOW {text}"
bullseye:
  name: ""
rooms:
  ingest:
    - room-tacrep-ingest
  publish:
    default:
      - room-tacrep-publish
    republish_on_higher_level: true
    rules:
      - confidence: [POSS LOW, POSS HIGH]
        cat_min: 1
        cat_max: 2
        types: [ELINT, IMINT]
        rooms: [room-precise]
      - confidence: [CONFIRMED]
        rooms: [room-certain, room-tacrep-publish]
types:
  - name: MTI
    kind: J
    start: 400
    end: 499
    fields: [callsign, id, activity, bullseye, link16, location, tai_msr, cat, time, fillins]
    rooms:
      ingest: [room-mti-ingest]
      publish: [room-mti-publish]
  - name: IMINT
    kind: I
    start: 100
    end: 199
    fields: [callsign, id, equipment, location, elevation, tai, time, cat]
    rooms:
      ingest: [room-imint-ingest]
      publish: [room-imint-publish]
  - name: ELINT
    kinds: [E, G]
    start: 500
    end: 599
    fields: [callsign, id, entity, activity, location, tai, ellipse, orientation, cat, time, fillins]
    rooms:
      ingest: [room-elint-ingest]
      publish: [room-elint-publish]
  - name: FUSED
    kind: F
    start: 900
    end: 999
    fields: [callsign, id, subject, location, cat, time, correlates]
    rooms:
      ingest: [room-fused-ingest]
      publish: [room-fused-publish]
templates:
  - name: ADHOC
    detect: '(?i)\*\*\*START\s+ADHOC'
    separator: lines
    evidence: tasking
    classification: true
    rooms:
      ingest: [room-adhoc-ingest]
      publish: [room-adhoc-publish]
    fields:
      - {name: effects, type: effects, line: 1}
      - {name: assets, type: assets, line: 2}
      - {name: target, type: name_id, line: 3}
      - {name: location, type: location, line: 4}
      - {name: eei, type: equipment, line: 5}
      - {name: reporting, type: reporting, line: 6}
  - name: SITREP
    detect: '(?i)\bSITREP\b'
    separator: comma
    evidence: report
    classification: true
    rooms:
      ingest: [room-sitrep-ingest]
      publish: [room-sitrep-publish]
    fields:
      - {name: callsign, type: text}
      - {name: equipment, type: equipment_at}
      - {name: location, type: location}
      - {name: time, type: time}
      - {name: frequency, type: frequency}
      - {name: heading, type: heading}
      - {name: activity, type: activity}
