navixy:
  base_url: "https://api.eu.navixy.com/v2"
  ws_url: "wss://ws.navixy.com/events"
  # websocket (default) fails over to polling. poll never opens the websocket.
  mode: "websocket"
  tracker_ids: []
  poll_interval_seconds: 30

chatsurfer:
  base_url: "https://chatsurfer.nro.mil"
  domain_id: "chatsurferxmppunclass"
  room_name: "freedom_flag"
  room_name_encrypted: "freedom_flag_encrypted"
  nickname: "navtracker"
  classification: "UNCLASSIFIED//FOUO"
  user_high_classification: "UNCLASSIFIED//FOUO"
  client_cert: "/data/certs/client/tls.crt"
  client_key: "/data/certs/client/tls.key"
  rate_limit: 60
  max_message_size: 4000
  encryption_required: false

# mode: pem, update cert/key to tls.crt/tls.key
# mode: ssh, update cert/key to id_rsa.pub/id_rsa
# mode: fernet, set FERNET_KEY. The literal None is unset, not a key.
crypto:
  encryption_cert: "/data/certs/client/tls.crt"
  encryption_key: "/data/certs/client/tls.key"
  mode: pem
  fernet_key: None
