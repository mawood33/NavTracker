[project]
name = "navtracker"
version = "0.1.0"
description = "Read Navixy tracker positions and publish them to ChatSurfer."
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "packages/navtracker_common"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["analytics", "navtracker_common"]

[tool.mypy]
python_version = "3.12"
files = ["app", "analytics", "packages/navtracker_common/navtracker_common"]
mypy_path = ".:packages/navtracker_common"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.domain.*",
    "app.application.*",
    "analytics.domain.*",
    "navtracker_common.*",
]
disallow_any_generics = true
no_implicit_reexport = true
strict_equality = true
