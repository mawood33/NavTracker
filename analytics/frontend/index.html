<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NavTracker analytics</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; }
    label { display: block; margin-top: 0.6rem; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 0.8rem; }
  </style>
</head>
<body>
  <h1>NavTracker analytics</h1>
  <p id="basemap">Basemap: waiting for the snapshot.</p>
  <p id="routing">Routing: waiting for the snapshot.</p>
  <label>Token <input id="token" size="32" autocomplete="off" spellcheck="false"></label>
  <label>WebSocket <input id="ws" size="48" value="ws://localhost:8080/ws"></label>
  <button id="connect" type="button">Connect</button>
  <p id="ws-status">WebSocket: closed</p>
  <h2>Sites</h2>
  <ul id="sites"></ul>
  <h2>Tracks</h2>
  <ul id="tracks"></ul>
  <h2>Route</h2>
  <label>From <input id="from" value=""></label>
  <label>To <input id="to" value=""></label>
  <label>Profile <input id="profile" value="truck"></label>
  <button id="route" type="button">Estimate</button>
  <pre id="result"></pre>
  <script>
    const params = new URLSearchParams(location.search);
    const tokenKey = "navtracker.analytics.token";
    const tokenInput = document.getElementById("token");
    const queryToken = params.get("token");
    if (queryToken) {
      tokenInput.value = queryToken;
      localStorage.setItem(tokenKey, queryToken);
    } else {
      tokenInput.value = localStorage.getItem(tokenKey) || "";
    }
    tokenInput.addEventListener("change", () => {
      localStorage.setItem(tokenKey, tokenInput.value);
    });
    const wsInput = document.getElementById("ws");
    if (params.get("ws")) {
      wsInput.value = params.get("ws");
    }
    const api = params.get("api") || "http://localhost:8080";
    const wsStatus = document.getElementById("ws-status");
    let socket;
    function currentToken() {
      return tokenInput.value.trim();
    }
    function setWsStatus(text) {
      wsStatus.textContent = "WebSocket: " + text;
    }
    function wsUrlWithToken(raw) {
      const token = currentToken();
      if (!token || raw.indexOf("token=") !== -1) {
        return raw;
      }
      const joiner = raw.indexOf("?") === -1 ? "?" : "&";
      return raw + joiner + "token=" + encodeURIComponent(token);
    }
    function trackItem(fix) {
      const item = document.createElement("li");
      item.textContent = fix.vehicle_id + " " + fix.lat + "," + fix.lon +
        " " + (fix.timestamp || "") + " speed " + fix.speed + " hdg " + fix.heading;
      return item;
    }
    function render(message) {
      const basemap = message.basemap || {};
      const routing = message.routing || {};
      document.getElementById("basemap").textContent =
        "Basemap: " + (basemap.provider || "unknown") +
        (basemap.attribution ? " (" + basemap.attribution + ")" : "");
      const names = (routing.profiles || []).map((item) => item.name).join(", ");
      document.getElementById("routing").textContent =
        "Routing: " + (routing.engine || "unknown") +
        (names ? " profiles " + names : "");
      const list = document.getElementById("sites");
      const tracks = document.getElementById("tracks");
      if (message.type === "snapshot") {
        list.replaceChildren();
        for (const site of message.sites || []) {
          const item = document.createElement("li");
          const types = (site.types || []).join(",");
          item.textContent = site.name + " " + (site.assessment || "") + " " +
            (site.status || "") + " " + site.confidence + (types ? " " + types : "");
          list.appendChild(item);
        }
        tracks.replaceChildren();
        for (const fix of message.tracks || []) {
          tracks.appendChild(trackItem(fix));
        }
      }
      if (message.type === "update") {
        for (const change of message.changes || []) {
          if (change.kind === "site" && change.op === "upsert" && change.item) {
            const item = document.createElement("li");
            item.textContent = change.item.name + " " + (change.item.assessment || "");
            list.appendChild(item);
          }
          if (change.kind === "track" && change.op === "upsert" && change.item) {
            tracks.appendChild(trackItem(change.item));
          }
        }
      }
    }
    document.getElementById("connect").onclick = () => {
      if (socket) socket.close();
      const url = wsUrlWithToken(wsInput.value.trim());
      setWsStatus("connecting");
      socket = new WebSocket(url);
      socket.onopen = () => setWsStatus("open");
      socket.onerror = () => setWsStatus("error");
      socket.onclose = (event) => {
        const reason = event.reason ? " " + event.reason : "";
        setWsStatus("closed code " + event.code + reason);
      };
      socket.onmessage = (event) => {
        render(JSON.parse(event.data));
      };
    };
    document.getElementById("route").onclick = async () => {
      const query = new URLSearchParams({
        from_site: document.getElementById("from").value,
        to_site: document.getElementById("to").value,
        profile: document.getElementById("profile").value || "truck"
      });
      const headers = {};
      const token = currentToken();
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch(api + "/routing?" + query.toString(), {headers: headers});
      if (response.status === 401) {
        document.getElementById("result").textContent =
          "Unauthorized: check token matches ANALYTICS_READ_TOKEN";
        return;
      }
      document.getElementById("result").textContent = await response.text();
    };
  </script>
</body>
</html>
